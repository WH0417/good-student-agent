[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "good-student-agent"
version = "0.4.0"
description = "Local course memory with traceable exam priorities and two revision modes"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]
pdf = ["pypdf>=5"]
media = ["faster-whisper>=1.2,<1.3", "av>=11,<16", "rapidocr>=3,<4", "onnxruntime>=1.20,<2", "pypdfium2>=5,<6", "Pillow>=10", "olefile>=0.47"]

[tool.setuptools.packages.find]
include = ["good_student*"]

[tool.setuptools.package-data]
"good_student.vendor.coach" = ["LICENSE"]
